[package]
name = "shortlink-rs"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[workspace]
members = [".", "xtask"]
# `cargo build` / `cargo test` 只针对应用本身，xtask 要显式指定才构建
default-members = ["."]

[dependencies]
actix-web = "4"
anyhow = "1.0.98"
chrono = { version = "0.4.41", features = ["serde"] }
env_logger = "0.11.8"
hmac = { version = "0.12.1", features = ["reset"] }
log = "0.4.27"
rand = "0.9.1"
redis = { version = "0.31.0", features = ["tokio-comp"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
sqlx = { version = "0.8.5", features = [
  "mysql",
  "chrono",
  "runtime-tokio-native-tls",
] }
subtle = "2.6.1"
tokio = { version = "1.45.0", features = ["full"] }

# 依赖始终按 release 优化，自己的代码保持轻度优化（1 级）方便断点调试。
#
# 两个原因：一是 debug 构建下 PBKDF2 这类纯计算的 crate 慢一个数量级；
# 二是泛型代码（`Hmac<Sha256>` 就是这样）会在**调用方** crate 里单态化，
# 只优化依赖没用，自己的 crate 也得开一点优化。
# 实测：把 PBKDF2 的 10 万轮从 3 秒降到 60 毫秒级。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
